apiVersion: v1
kind: Service
metadata:
  name: devops-atolyesi-app-service
  namespace: default
  labels:
    app: devops-atolyesi-app
spec:
  selector:
    app: devops-atolyesi-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30091
      name: http
  type: NodePort 