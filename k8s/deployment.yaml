apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-atolyesi-app
  namespace: default
  labels:
    app: devops-atolyesi-app
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-atolyesi-app
  template:
    metadata:
      labels:
        app: devops-atolyesi-app
        version: "1.0"
    spec:
      containers:
      - name: devops-atolyesi-app
        image: serdardevops/devops-atolyesi-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: JAVA_OPTS
          value: "-Xms128m -Xmx256m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5 