apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-atolyesi-app
  namespace: default
  labels:
    app: devops-atolyesi-app
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-atolyesi-app
  template:
    metadata:
      labels:
        app: devops-atolyesi-app
        version: "1.0"
    spec:
      containers:
      - name: devops-atolyesi-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10 