apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: devops-atolyesi-app

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: IMAGE_PLACEHOLDER
    newName: serdardevops/devops-atolyesi-app
    newTag: IMAGE_TAG_PLACEHOLDER

commonLabels:
  app: devops-atolyesi-app
  managed-by: jenkins

namespace: default 